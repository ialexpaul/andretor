[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farro-mendez-ipa"
version = "0.1.0"
description = "Automatización Inteligente de Procesos (IPA) para FARRO MENDEZ CORPORATION S.A.C."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FARRO MENDEZ Dev Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "google-generativeai>=0.8.3",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.15"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
